name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Build Web Assets and Sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Checking Java version..."
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java 17 or higher is required, detected: $JAVA_MAJOR"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Searching android/app/build/outputs/apk:"
            find android/app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          echo "Verified APK at: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TMP_DIR="${RUNNER_TEMP:-/tmp}/release_assets"
          mkdir -p "$RUNNER_TMP_DIR"
          
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-_')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="noorani-quran"
          fi
          
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${RUNNER_TMP_DIR}/${ASSET_NAME}"
          
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          echo "Creating GitHub Release with tag: $TAG_NAME"
          
          gh release create "$TAG_NAME" "$ASSET_PATH#$ASSET_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "### 📱 নূরানী কুরআন (Noorani Quran) Debug APK
            
          - **Release Tag:** \`$TAG_NAME\`
          - **Build Run Number:** #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
          - **Source Commit:** \`${{ github.sha }}\`
          - **File Name:** \`$ASSET_NAME\`
          
          > 💡 **নোট:** এটি সরাসরি আপনার অ্যান্ড্রয়েড ফোনে ইনস্টল করে ব্যবহারের জন্য স্বয়ংক্রিয়ভাবে জেনারেট করা টেস্ট/ডিবাগ APK।" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "=========================================="
            echo "🎉 GitHub Release Published Successfully!"
            echo "Release Tag: $TAG_NAME"
            echo "Asset Name: $ASSET_NAME"
            echo "Download URL: $RELEASE_URL"
            echo "=========================================="
            
            echo "## 🎉 Android APK Release Ready!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Your Android APK is ready for download:" >> $GITHUB_STEP_SUMMARY
            echo "- 📥 **[Download APK from GitHub Releases](${RELEASE_URL})**" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset:** \`${ASSET_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag:** \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifact:** \`app-debug-apk\` is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Release publishing encountered an error, but the APK was successfully built."
            echo "## ⚠️ APK Built - Artifact Available" >> $GITHUB_STEP_SUMMARY
            echo "APK build succeeded! You can download the APK from the **Artifacts** section of this workflow run: \`app-debug-apk\`." >> $GITHUB_STEP_SUMMARY
          fi
