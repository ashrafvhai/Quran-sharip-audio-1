name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Web App & Sync to Android
        run: |
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Sharif-Noorani-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release and Tag
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          
          echo "Creating Release with Tag: $TAG_NAME"
          
          gh release create "$TAG_NAME" "$APK_PATH#Quran-Sharif-Noorani.apk" \
            --title "নূরানী কুরআন - Release $TAG_NAME" \
            --notes "নূরানী কুরআন অ্যান্ড্রয়েড অ্যাপ (APK)। নিচে Assets সেকশন থেকে ডাউনলোড করুন।" \
            --latest

      - name: Print Download Instructions
        if: always()
        run: |
          echo "## 🎉 নূরানী কুরআন APK প্রস্তুত!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "আপনার অ্যান্ড্রয়েড APK সফলভাবে বিল্ড হয়েছে।" >> $GITHUB_STEP_SUMMARY
