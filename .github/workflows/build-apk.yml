name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node dependencies
        run: |
          echo "Installing npm dependencies..."
          npm install --legacy-peer-deps

      - name: Build Web App and Sync Android
        env:
          CI: true
        run: |
          echo "Building React web application..."
          npm run build
          
          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ]; then
            echo "Android platform not found or incomplete. Adding Android via Capacitor..."
            npx cap add android
          fi
          
          echo "Syncing web assets with Capacitor Android..."
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          else
            echo "Warning: android/gradlew not found, ensuring wrapper exists..."
            cd android && gradle wrapper && chmod +x gradlew && cd ..
          fi

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          echo "Building Debug APK with Gradle..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: locate_apk
        run: |
          FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "Error: No APK found after build!"
            find android -name "*.apk" || true
            exit 1
          fi
          echo "Found APK at: $FOUND_APK"
          ls -lh "$FOUND_APK"
          
          ASSET_NAME="Quran-Noorani-v${{ github.run_number }}.apk"
          RUNNER_TMP="${RUNNER_TEMP:-/tmp}/apk_output"
          mkdir -p "$RUNNER_TMP"
          cp "$FOUND_APK" "$RUNNER_TMP/$ASSET_NAME"
          
          echo "apk_path=$FOUND_APK" >> "$GITHUB_OUTPUT"
          echo "asset_path=$RUNNER_TMP/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-noorani-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and Tag
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="নূরানী কুরআন - Android APK v1.0.${{ github.run_number }}"
          ASSET_PATH="${{ steps.locate_apk.outputs.asset_path }}"
          ASSET_NAME="${{ steps.locate_apk.outputs.asset_name }}"
          
          echo "Publishing GitHub Release with Tag: $TAG_NAME"
          
          gh release create "$TAG_NAME" "$ASSET_PATH#$ASSET_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "## 📱 নূরানী কুরআন (Noorani Quran) Android APK
            
          - **Release Tag:** \`$TAG_NAME\`
          - **Build:** #${{ github.run_number }}
          - **APK File:** \`$ASSET_NAME\`
          
          ### 📥 কীভাবে ফোনে ইনস্টল করবেন:
          1. নিচে Assets সেকশন থেকে \`$ASSET_NAME\` ফাইলে ক্লিক করে ডাউনলোড করুন।
          2. ফোনে ডাউনলোড সম্পন্ন হলে ফাইলটিতে ক্লিক করে Install দিন।" \
            --latest

      - name: Summary & Download Info
        if: always()
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          ASSET_NAME="${{ steps.locate_apk.outputs.asset_name }}"
          
          echo "## 📱 APK বিল্ড সম্পন্ন হয়েছে!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **APK ফাইলের নাম:** \`${ASSET_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Releases Tag:** \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **সরাসরি ডাউনলোড:** এই রানটির নিচের **Artifacts** সেকশনে \`quran-noorani-apk\` ফাইলটি সরাসরি পাবেন অথবা আপনার রিপোজিটরির **Releases** সেকশনে যান।" >> $GITHUB_STEP_SUMMARY
